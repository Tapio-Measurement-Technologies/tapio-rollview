# Manual re-sync only. The automatic path lives in the publish-website job of
# build.yml, which knows exactly which tag it just published. Use this workflow
# when the release notes were edited by hand after the release went out, or to
# repoint the download page at a specific tag.
name: Update release information to WordPress
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish to the website (e.g. v1.5.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-wp:
    runs-on: ubuntu-latest
    steps:
      - name: Get Release Data
        id: release_data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_JSON=$(gh release view "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" --json assets,body)
          RAW_EXE_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".exe")) | .url' | head -n 1)
          RAW_BODY=$(echo "$RELEASE_JSON" | jq -r '.body')
          PAYLOAD=$(jq -n \
            --arg url "$RAW_EXE_URL" \
            --arg desc "$RAW_BODY" \
            '{meta: {rollview_release_download_url: $url, rollview_release_description: $desc}}')
          echo "$PAYLOAD" > payload.json

      - name: Update WordPress via REST API
        env:
          WP_URL: "https://tapiotechnologies.com/wp-json/wp/v2/pages/3920"
          WP_AUTH: ${{ secrets.WP_AUTH_B64 }}
        run: |
          curl -X POST "$WP_URL" \
            -H "Authorization: Basic $WP_AUTH" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json
