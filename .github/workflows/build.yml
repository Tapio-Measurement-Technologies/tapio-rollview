name: Build Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
        include:
          - os: ubuntu-latest
            platform: linux
            extension: ""
          - os: windows-latest
            platform: windows
            extension: ".exe"

    runs-on: ${{ matrix.os }}
    environment: Production

    steps:
      - name: Check out the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-build.txt

      # The .mo catalogs are generated, not committed; PyInstaller bundles
      # src/locales/ below and needs them on disk first.
      - name: Compile translations
        run: python compile_translations.py

      - name: Create version file
        run: echo "__version__ = '${{ github.ref_name }}'" > src/version.py

      - name: Create version resource file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $parts = ([regex]::Matches($version, '\d+')).Value
          $v = @('0', '0', '0', '0')
          for ($i = 0; $i -lt [Math]::Min($parts.Count, 3); $i++) { $v[$i] = $parts[$i] }

          $versionInfo = @"
          # UTF-8
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($($v[0]), $($v[1]), $($v[2]), $($v[3])),
              prodvers=($($v[0]), $($v[1]), $($v[2]), $($v[3])),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
              ),
            kids=[
              StringFileInfo(
                [
                StringTable(
                  u'040904B0',
                  [StringStruct(u'CompanyName', u'Tapio Measurement Technologies Oy'),
                  StringStruct(u'FileDescription', u'RollView'),
                  StringStruct(u'FileVersion', u'$version'),
                  StringStruct(u'InternalName', u'tapio-rollview'),
                  StringStruct(u'LegalCopyright', u'Copyright (c) Tapio Measurement Technologies Oy'),
                  StringStruct(u'OriginalFilename', u'tapio-rollview.exe'),
                  StringStruct(u'ProductName', u'RollView'),
                  StringStruct(u'ProductVersion', u'$version')])
                ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          "@

          $versionInfo | Out-File -FilePath "version_info.txt" -Encoding UTF8

      - name: Build executable
        run: >
          pyinstaller
          --clean
          --onefile
          --noconsole
          --add-data "src/postprocessors/:postprocessors/"
          --add-data "src/assets/fonts/:assets/fonts/"
          --add-data "src/locales/:locales/"
          --add-data "src/theme/tapio-tokens.json:theme/"
          --add-data "src/theme/rollview-tokens.json:theme/"
          --add-data "src/theme/rollview.qss:theme/"
          --hidden-import pandas
          --add-data "src/assets/:assets"
          --splash src/assets/splash.png
          --icon src/assets/tapio_favicon.ico
          --version-file version_info.txt
          src/main.py

      - name: Rename executable
        run: >
          mv
          dist/main${{ matrix.extension }}
          dist/rollview-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.extension }}

      - name: Azure Login (Windows)
        if: runner.os == 'Windows'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Sign executable (Windows)
        if: runner.os == 'Windows'
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16 # v1
        with:
          endpoint: https://neu.codesigning.azure.net/
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}/dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Audit dependencies and generate signed-artifact evidence
        uses: Tapio-Measurement-Technologies/tapio-build-tooling/actions/python-release-evidence@438406e2d9fc6011bfc402af75d26f41d7ee5577
        with:
          config: build-tooling.toml
          product: tapio-rollview
          requirement-group: runtime
          output: dist/rollview-${{ github.ref_name }}-${{ matrix.platform }}.cdx.json
          artifact: dist/rollview-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.extension }}
          version: ${{ github.ref_name }}
          platform: ${{ matrix.platform }}
          audit: ${{ runner.os == 'Linux' }}
          upload-name: rollview-${{ github.ref_name }}-${{ matrix.platform }}-sbom

      - name: Compress executable (Linux)
        if: runner.os == 'Linux'
        run: |
          zip dist/rollview-${{ github.ref_name }}-${{ matrix.platform }}.zip \
          dist/rollview-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.extension }}

      - name: Compress executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/rollview-${{ github.ref_name }}-windows.exe" `
          -DestinationPath "dist/rollview-${{ github.ref_name }}-windows.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollview-${{ github.ref_name }}-${{ matrix.platform }}
          path: |
            dist/rollview-${{ github.ref_name }}-${{ matrix.platform }}${{ matrix.extension }}
            dist/rollview-${{ github.ref_name }}-${{ matrix.platform }}.zip
            dist/rollview-${{ github.ref_name }}-${{ matrix.platform }}.cdx.json

      - name: Clean up version file
        if: always()
        run: rm src/version.py

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    outputs:
      latest: ${{ steps.kind.outputs.latest }}
      prerelease: ${{ steps.kind.outputs.prerelease }}

    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download Artifact (Linux)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rollview-${{ github.ref_name }}-linux
          path: dist/

      - name: Download Artifact (Windows)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rollview-${{ github.ref_name }}-windows
          path: dist/

      # A tag containing a hyphen (v1.6.0-beta.1) is a pre-release: never "Latest",
      # never published to the website. A plain vX.Y.Z takes "Latest" only when it is
      # the highest stable tag, so a patch to an older line cannot steal it.
      - name: Classify release
        id: kind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" != "${TAG%%-*}" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            NEWEST=$(gh release list --repo "${{ github.repository }}" --limit 200 \
                       --exclude-drafts --exclude-pre-releases \
                       --json tagName --jq '.[].tagName' \
                     | sort -V | tail -n 1)
            TOP=$(printf '%s\n%s\n' "$TAG" "$NEWEST" | sort -V | tail -n 1)
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            if [ "$TOP" = "$TAG" ]; then
              echo "latest=true" >> "$GITHUB_OUTPUT"
            else
              echo "latest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/rollview-${{ github.ref_name }}-linux.zip" \
            "dist/rollview-${{ github.ref_name }}-linux.cdx.json" \
            "dist/rollview-${{ github.ref_name }}-windows.zip" \
            "dist/rollview-${{ github.ref_name }}-windows.cdx.json" \
            "dist/rollview-${{ github.ref_name }}-windows.exe" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "" \
            --verify-tag \
            --latest=${{ steps.kind.outputs.latest }} \
            ${{ steps.kind.outputs.prerelease == 'true' && '--prerelease' || '' }}

  # Only the tag that actually took "Latest" reaches the public download page.
  # Pre-releases and patches to older lines skip this job entirely.
  publish-website:
    if: needs.release.outputs.latest == 'true'
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read

    steps:
      - name: Build WordPress payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_JSON=$(gh release view "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --json assets,body)
          RAW_EXE_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".exe")) | .url' | head -n 1)
          RAW_BODY=$(echo "$RELEASE_JSON" | jq -r '.body')
          PAYLOAD=$(jq -n \
            --arg url "$RAW_EXE_URL" \
            --arg desc "$RAW_BODY" \
            '{meta: {rollview_release_download_url: $url, rollview_release_description: $desc}}')
          echo "$PAYLOAD" > payload.json

      - name: Update WordPress via REST API
        env:
          WP_URL: "https://tapiotechnologies.com/wp-json/wp/v2/pages/3920"
          WP_AUTH: ${{ secrets.WP_AUTH_B64 }}
        run: |
          curl -X POST "$WP_URL" \
            -H "Authorization: Basic $WP_AUTH" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json
