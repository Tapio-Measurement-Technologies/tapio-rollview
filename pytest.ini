[pytest]
testpaths = src/test
pythonpath = src
qt_api = pyside6

# Qt logs a lot of real bugs at warning level and nothing else notices them:
# layout misuse, cross-thread pixmap access, QThread destroyed while running.
# Treat them as failures, and list the known-benign ones explicitly rather than
# lowering the bar for everything.
qt_log_level_fail = WARNING
qt_log_ignore =
    # The offscreen platform plugin narrates what it cannot do. Harmless, and
    # only ever seen under QT_QPA_PLATFORM=offscreen.
    ^This plugin does not support
